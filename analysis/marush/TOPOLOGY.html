<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Defense-in-depth: the data island is built from untrusted source. Allow only
     inline script/style (the viewer is self-contained) and block network egress, so
     even a breakout cannot exfiltrate. The injector also escapes < > & in the data. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>System topology</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel-2: #2d2d2d;
    --text: #d4d4d4; --muted: #8a8a8a; --accent: #cc785c;
    --border: #3a3a3a; --blue: #5ba0e0; --green: #6bb85a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; cursor: grab; }
  #map.dragging { cursor: grabbing; }

  #hud { position: absolute; top: 12px; left: 12px; width: 280px;
    display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; }
  .panel h1 { font-size: 15px; color: var(--accent); margin-bottom: 2px; }
  .panel .sub { color: var(--muted); font-size: 12px; }
  #search { width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font: inherit; outline: none; }
  #search:focus { border-color: var(--accent); }
  #results { max-height: 180px; overflow-y: auto; margin-top: 4px; }
  #results div { padding: 4px 6px; border-radius: 4px; cursor: pointer;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results div:hover { background: var(--panel-2); }
  #results .kind { color: var(--muted); font-size: 11px; margin-left: 6px; }

  .toggles label { display: flex; align-items: center; gap: 7px;
    font-size: 13px; padding: 2px 0; cursor: pointer; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  #flows select { width: 100%; margin-top: 4px; padding: 5px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font: inherit; }

  #sidebar { position: absolute; top: 12px; right: 12px; bottom: 12px;
    width: 320px; overflow-y: auto; z-index: 2; display: none; }
  #sidebar.open { display: block; }
  #sidebar h2 { font-size: 16px; word-break: break-word; }
  #sidebar .meta { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  #sidebar .desc { font-size: 13px; margin: 0 0 10px; }
  #sidebar .desc .cap { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  #sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 12px 0 4px; }
  #sidebar .link { color: var(--blue); cursor: pointer; display: block;
    padding: 2px 0; font-size: 13px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  #sidebar .link:hover { color: var(--accent); }
  #sidebar ol { padding-left: 20px; } #sidebar ol li { margin: 6px 0; font-size: 13px; }
  #sidebar .closebtn { float: right; cursor: pointer; color: var(--muted);
    font-size: 18px; line-height: 1; } #sidebar .closebtn:hover { color: var(--text); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 9px;
    font-size: 11px; border: 1px solid var(--border); color: var(--muted); margin-right: 4px; }
  .badge.entry { border-color: var(--accent); color: var(--accent); }

  #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; z-index: 2; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; }
  #err { position: absolute; inset: 0; display: none; place-items: center; z-index: 9; }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud">
  <div class="panel">
    <h1 id="title">System topology</h1>
    <div class="sub" id="stats"></div>
  </div>
  <div class="panel">
    <input id="search" type="search" placeholder="Search modules, stores, jobs…" autocomplete="off">
    <div id="results"></div>
  </div>
  <div class="panel toggles" id="toggles"></div>
  <div class="panel" id="flows" style="display:none">
    <div class="sub">Business flow walkthrough</div>
    <select id="flowSel"><option value="">— none —</option></select>
  </div>
  <details class="panel" id="obs" style="display:none">
    <summary style="cursor:pointer;color:var(--muted);font-size:12px">Architect observations</summary>
    <ul id="obsList" style="padding-left:18px;margin-top:6px;font-size:12.5px"></ul>
  </details>
</div>

<aside id="sidebar" class="panel"></aside>
<div id="hint">scroll to zoom · drag to pan · click a node · double-click to zoom in · Esc to reset</div>
<div id="err" class="panel"><p>No topology data found in this file.<br>
Re-run <code>/code-modernization:modernize-map</code> to regenerate it.</p></div>

ation.cs", "name": "CustomerFilteredPagination", "kind": "module", "language": "csharp", "loc": 6, "file": "Site/Gmf.Marush.Care.Api/Models/Customers/CustomerFilteredPagination.cs"}, {"id": "Site/Gmf.Marush.Care.Api/Models/Customers/CustomerListItemDto.cs", "name": "CustomerListItemDto", "kind": "module", "language": "csharp", "loc": 7, "file": "Site/Gmf.Marush.Care.Api/Models/Customers/CustomerListItemDto.cs"}, {"id": "Site/Gmf.Marush.Care.Api/Models/Customers/NewCustomerDto.cs", "name": "NewCustomerDto", "kind": "module", "language": "csharp", "loc": 15, "file": "Site/Gmf.Marush.Care.Api/Models/Customers/NewCustomerDto.cs"}, {"id": "Site/Gmf.Marush.Care.Api/Validation/CustomerDtoValidator.cs", "name": "CustomerDtoValidator", "kind": "module", "language": "csharp", "loc": 10, "file": "Site/Gmf.Marush.Care.Api/Validation/CustomerDtoValidator.cs"}, {"id": "Site/Gmf.Marush.Care.Api/Validation/NewCustomerDtoValidator.cs", "name": "NewCustomerDtoValidator", "kind": "module", "language": "csharp", "loc": 10, "file": "Site/Gmf.Marush.Care.Api/Validation/NewCustomerDtoValidator.cs"}, {"id": "Site/Gmf.Marush.Care.App/src/app/features/admin/clients/clients-page.ts", "name": "clients-page", "kind": "module", "language": "typescript", "loc": 105, "file": "Site/Gmf.Marush.Care.App/src/app/features/admin/clients/clients-page.ts", "description": "clients-page is the admin screen for Customer (CRM) management where staff look up a client and open the client's record to update it. It shows a paginated table of clients with an \"Ime i prezime\" (full name) column and a \"Kontakt\" (contact number) column, filtered by name through a name autocomplete or a validated form; clicking a row opens /admin/klijent for that client, and the add action opens it with no id. It calls autocomplete, clients, item, table-metadata and table-pagination, and is an entry point dispatched by admin-routes."}, {"id": "Site/Gmf.Marush.Care.App/src/app/features/admin/clients/clients.ts", "name": "clients", "kind": "module", "language": "typescript", "loc": 64, "file": "Site/Gmf.Marush.Care.App/src/app/features/admin/clients/clients.ts"}, {"id": "Site/Gmf.Marush.Care.App/src/app/features/admin/clients/edit/appointment.ts", "name": "appointment", "kind": "module", "language": "typescript", "loc": 4, "file": "Site/Gmf.Marush.Care.App/src/app/features/admin/clients/edit/appointment.ts"}, {"id": "Site/Gmf.Marush.Care.App/src/app/features/admin/clients/edit/clients-edit-page.ts", "name": "clients-edit-page", "kind": "module", "language": "typescript", "loc": 204, "file": "Site/Gmf.Marush.Care.App/src/app/features/admin/clients/edit/clients-edit-page.ts", "description": "clients-edit-page is the Customer (CRM) management admin page in the \"Look up and update a client record\" flow: it loads an existing client by id, or starts a blank Client, and lets admins edit the client's phones, emails and appointments before submitting under the captcha-protected 'CLIENT_EDIT' action and returning to /admin/klijenti. It calls appointment, captcha, clients, date-picker, field-group, input and request, and reads Translations sr/en/ru. It is reached only through a dispatch from admin-routes."}, {"id": "Site/Gmf.Marush.Care.App/src/app/features/admin/clients/edit/request.ts", "name": "request", "kind": "module", "language": "typescript", "loc": 41, "file": "Site/Gmf.Marush.Care.App/src/app/features/admin/clients/edit/request.ts"}, {"id": "Site/Gmf.Marush.Care.Domain/Models/Customer.cs", "name": "Customer", "kind": "module", "language": "csharp", "loc": 37, "file": "Site/Gmf.Marush.Care.Domain/Models/Customer.cs"}, {"id": "Site/Gmf.Marush.Care.Domain/Models/CustomerDetails.cs", "name": "CustomerDetails", "kind": "module", "language": "csharp", "loc": 5, "file": "Site/Gmf.Marush.Care.Domain/Models/CustomerDetails.cs"}, {"id": "Site/Gmf.Marush.Care.Domain/Models/ExistingCustomer.cs", "name": "ExistingCustomer", "kind": "module", "language": "csharp", "loc": 7, "file": "Site/Gmf.Marush.Care.Dom d": "module", "language": "typescript", "loc": 19, "file": "Site/Gmf.Marush.Care.App/src/app/application-configuration.ts"}, {"id": "Site/Gmf.Marush.Care.App/src/app/application-server-configuration.ts", "name": "application-server-configuration", "kind": "module", "language": "typescript", "loc": 26, "file": "Site/Gmf.Marush.Care.App/src/app/application-server-configuration.ts"}, {"id": "Site/Gmf.Marush.Care.App/src/app/application.ts", "name": "application", "kind": "module", "language": "typescript", "loc": 68, "file": "Site/Gmf.Marush.Care.App/src/app/application.ts"}, {"id": "Site/Gmf.Marush.Care.App/src/app/shared/components/dialog/dialog-operation.ts", "name": "dialog-operation", "kind": "module", "language": "typescript", "loc": 30, "file": "Site/Gmf.Marush.Care.App/src/app/shared/components/dialog/dialog-operation.ts"}, {"id": "Site/Gmf.Marush.Care.App/src/app/shared/components/dialog/dialog.ts", "name": "dialog", "kind": "module", "language": "typescript", "loc": 60, "file": "Site/Gmf.Marush.Care.App/src/app/shared/components/dialog/dialog.ts"}, {"id": "Site/Gmf.Marush.Care.App/src/app/shared/components/expansion-panel/expansion-panel.ts", "name": "expansion-panel", "kind": "module", "language": "typescript", "loc": 56, "file": "Site/Gmf.Marush.Care.App/src/app/shared/components/expansion-panel/expansion-panel.ts"}, {"id": "Site/Gmf.Marush.Care.App/src/app/shared/components/footer/footer.ts", "name": "footer", "kind": "module", "language": "typescript", "loc": 147, "file": "Site/Gmf.Marush.Care.App/src/app/shared/components/footer/footer.ts", "description": "The footer node is the shared Footer component (selector marush-footer) that renders the salon site's footer from footer.html and exposes marushDetails for display. It offers redirectToContact, which navigates to the translated 'contact' route when isAction accepts the click or key press. It calls keyboard-event, marush-details and routing-translator, and is called by application. The packet does not include the template, so which details the footer actually displays is not shown."}, {"id": "Site/Gmf.Marush.Care.App/src/app/shared/components/forms/autocomplete/autocomplete.ts", "name": "autocomplete", "kind": "module", "language": "typescript", "loc": 132, "file": "Site/Gmf.Marush.Care.App/src/app/shared/components/forms/autocomplete/autocomplete.ts", "description": "autocomplete is a shared Angular form component (marush-autocomplete) that suggests matching entries while a user types in the salon admin's forms. It waits before searching (debounceMilliseconds = 300), only runs the supplied search once the query is long enough (defaultMinimumQueryLength = 2), shows the results, supports keyboard navigation and cancel, and writes the chosen label into the form control. It calls field, item, keyboard-event, suggestion-commitment and suggestion-navigation, and is called by calendar-entry-dialog and clients-page."}, {"id": "Site/Gmf.Marush.Care.App/src/app/shared/components/forms/autocomplete/suggestion-commitment.ts", "name": "suggestion-commitment", "kind": "module", "language": "typescript", "loc": 31, "file": "Site/Gmf.Marush.Care.App/src/app/shared/components/forms/autocomplete/suggestion-commitment.ts"}, {"id": "Site/Gmf.Marush.Care.App/src/app/shared/components/forms/autocomplete/suggestion-navigation.ts", "name": "suggestion-navigation", "kind": "module", "language": "typescript", "loc": 30, "file": "Site/Gmf.Marush.Care.App/src/app/shared/components/forms/autocomplete/suggestion-navigation.ts"}, {"id": "Site/Gmf.Marush.Care.App/src/app/shared/components/forms/checkbox/checkbox.ts", "name": "checkbox", "kind": "module", "language": "typescript", "loc": 75, "file": "Site/Gmf.Marush.Care.App/src/app/shared/components/forms/checkbox/checkbox.ts", "description": "checkbox is a reusable Angular form control in the salon app's shared components that renders a labelled checkbox (selector marush-checkbox). It takes a required labelText input, a checked flag defaulting ": "Site/Gmf.Marush.Care.Infrastructure/Data/Configurations/Customers/EmailsConfiguration.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Configurations/Customers/PhonesConfiguration.cs", "name": "PhonesConfiguration", "kind": "module", "language": "csharp", "loc": 19, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Configurations/Customers/PhonesConfiguration.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Configurations/UserConfiguration.cs", "name": "UserConfiguration", "kind": "module", "language": "csharp", "loc": 19, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Configurations/UserConfiguration.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/ContextFactory.cs", "name": "ContextFactory", "kind": "module", "language": "csharp", "loc": 21, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/ContextFactory.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Appointments/AppointmentDto.cs", "name": "AppointmentDto", "kind": "module", "language": "csharp", "loc": 77, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Appointments/AppointmentDto.cs", "description": "AppointmentDto is the stored record for one salon appointment: customer, phone, email, language, scheduled start, expected end, description, money, online-booking flag, treatments and status, falling back to a DefaultDuration of one hour when no end is set. It maps itself to CalendarAppointment and AppointmentStatus, replaces its treatments, assigns a Customer and schedules through CalendarSlot. It calls AppointmentTreatmentDto, CustomerDto, CustomerPhoneDto, CustomerEmailDto, CalendarPeriod and EntityDto, and is called by AppointmentRepository, CalendarRetrievalRepository, CustomerModificationRepository and AppointmentConfiguration."}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Appointments/AppointmentStatusDto.cs", "name": "AppointmentStatusDto", "kind": "module", "language": "csharp", "loc": 7, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Appointments/AppointmentStatusDto.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Appointments/AppointmentTreatmentDto.cs", "name": "AppointmentTreatmentDto", "kind": "module", "language": "csharp", "loc": 7, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Appointments/AppointmentTreatmentDto.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Calendar/CalendarEntryDto.cs", "name": "CalendarEntryDto", "kind": "module", "language": "csharp", "loc": 21, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Calendar/CalendarEntryDto.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Calendar/CalendarNoteDto.cs", "name": "CalendarNoteDto", "kind": "module", "language": "csharp", "loc": 17, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Calendar/CalendarNoteDto.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Calendar/CalendarSlot.cs", "name": "CalendarSlot", "kind": "module", "language": "csharp", "loc": 14, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Calendar/CalendarSlot.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Customers/CustomerDto.cs", "name": "CustomerDto", "kind": "module", "language": "csharp", "loc": 47, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Customers/CustomerDto.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Customers/CustomerEmailDto.cs", "name": "CustomerEmailDto", "kind": "module", "language": "csharp", "loc": 9, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Customers/CustomerEmailDto.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Customers/CustomerPhoneDto.cs", "name": "CustomerPhoneDto", "kind": "module", "language": "csharp", "loc": 9, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Customers/CustomerPhoneDto.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Customers/CustomerPropertiesDto.cs", "name": "CustomerPropertiesDto", "kind": "module", "language": "csharp", "loc": 14, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/Customers/CustomerPropertiesDto.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/UserDto.cs", "name": "UserDto", "kind": "module", "language": "csharp", "loc": 7, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Entities/UserDto.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/MarushCareContext.cs", "name": "MarushCareContext", "kind": "module", "language": "csharp", "loc": 12, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/MarushCareContext.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/AppointmentRepository.cs", "name": "AppointmentRepository", "kind": "module", "language": "csharp", "loc": 91, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/AppointmentRepository.cs", "description": "AppointmentRepository is the Persistence module that saves salon bookings in the flows \"Book an appointment online\" and \"Accept or reject a booking from email\": it records a new appointment for a Customer or ExistingCustomer with the given Period and TreatmentSelection, and applies an AppointmentDecision that changes the booking's status. It reads the SQL tables AppointmentStatus, Appointments, CustomerEmails, CustomerPhones and Customers, and writes Appointments and Customers. Its calls include AppointmentDto, CustomerDto, CustomerEmailDto and CustomerPhoneDto; it is called by RepositoryModule and dispatched via IAppointmentRepository."}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/CalendarEntryAppointments.cs", "name": "CalendarEntryAppointments", "kind": "module", "language": "csharp", "loc": 60, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/CalendarEntryAppointments.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/CalendarModificationRepository.cs", "name": "CalendarModificationRepository", "kind": "module", "language": "csharp", "loc": 82, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/CalendarModificationRepository.cs", "description": "CalendarModificationRepository is the Persistence component behind the \"Run the weekly calendar\" flow that adds, updates and deletes the calendar entries tied to salon appointments and upserts or deletes calendar notes, returning false and changing nothing when the target entry or customer does not exist. It calls CalendarEntry, CalendarEntryAppointments, CalendarEntryDto, CalendarNote, CalendarNoteDto and Period, implements ICalendarModificationRepository, and reads and writes the SQL tables CalendarEntries and CalendarNotes. RepositoryModule calls it, and calls reach it through ICalendarModificationRepository."}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/CalendarRetrievalRepository.cs", "name": "CalendarRetrievalRepository", "kind": "module", "language": "csharp", "loc": 79, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/CalendarRetrievalRepository.cs", "description": "CalendarRetrievalRepository is the read-side Persistence module behind the \"Run the weekly calendar\" flow: it fetches the admin calendar entries and notes for a week, the public appointments that do not yet have an entry, checks whether a booking's slot is already taken, and finds an appointment's contact email and language. It reads the SQL tables Appointments, CalendarEntries and CalendarNotes, and calls CalendarWeekRange, CalendarSlot, CalendarBooking, AppointmentStatus, AppointmentDto, CalendarEntryDto and CalendarNoteDto. It is called by RepositoryModule and dispatched via ICalendarRetrievalRepository."}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/CalendarWeekRange.cs", "name": "CalendarWeekRange", "kind": "module", "language": "csharp", "loc": 11, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/CalendarWeekRange.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/CustomerModificationRepository.cs", "name": "CustomerModificationRepository", "kind": "module", "language": "csharp", "loc": 149, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/CustomerModificationRepository.cs", "description": "CustomerModificationRepository is the Persistence module behind the \"Look up and update a client record\" flow: it deletes a client record, or stores CustomerDetails by creating or updating a client together with the client's phones, emails and Performed appointments. It reads the SQL tables Customers, CustomerPhones, CustomerEmails, Appointments, AppointmentStatus and Users, and writes Customers, CustomerPhones, CustomerEmails and Appointments. It calls CustomerDto, AppointmentDto, AppointmentStatusDto, UserDto and AppointmentStatus, among others, and is called by RepositoryModule and dispatched via ICustomerModificationRepository."}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/CustomerRetrievalRepository.cs", "name": "CustomerRetrievalRepository", "kind": "module", "language": "csharp", "loc": 49, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/CustomerRetrievalRepository.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/UserRepository.cs", "name": "UserRepository", "kind": "module", "language": "csharp", "loc": 25, "file": "Site/Gmf.Marush.Care.Infrastructure/Data/Repositories/UserRepository.cs"}, {"id": "Site/Gmf.Marush.Care.Infrastructure/Migrations", "name": "EF Migrations (InitialCreate)", "kind": "job", "language": "csharp", "loc": 905, "file": "Site/Gmf.Marush.Care.Infrastructure/Migrations", "description": "EF Migrations (InitialCreate) is a Persistence job that creates the initial database schema for the salon booking and admin app: customer records with contact details and properties, user accounts, appointments with statuses and treatments, and calendar entries and notes. It writes the SQL tables AppointmentStatus, AppointmentTreatments, Appointments, CalendarEntries, CalendarNotes, CustomerEmails, CustomerPhones, CustomerProperties, Customers and Users. It is not an entry point and has no flows of its own; it is dispatched by build.yaml and update-database.yaml."}, {"id": "Site/Gmf.Marush.Care.Services/Domain/Appointment/Service.cs", "name": "Service", "kind": "module", "language": "csharp", "loc": 20, "file": "Site/Gmf.Marush.Care.Services/Domain/Appointment/Service.cs"}]}, {"id": "dom:D10", "name": "API hosting platform", "kind": "domain", "children": [{"id": "Packages/Gmf.Net.Core.Common/ApiRunner.cs", "name": "ApiRunner", "kind": "module", "language": "csharp", "loc": 79, "file": "Packages/Gmf.Net.Core.Common/ApiRunner.cs", "description": "ApiRunner is the shared startup routine for the salon app's web API in the \"API hosting platform\" domain. Extending ApplicationRunner, it sets up dependency injection, adds the standard services and the request pipeline, and then starts the application. Its outgoing calls go to ApplicationRunner, AspireExtensions, AutofacExceptionMiddleware, Extensions, HandlingExtensions, SecurityExtensions and ValidationExtensions, together covering service discovery, error wrapping, exception handling, security and request validation. Its only incoming caller is Program; the packet lists no flows and no direct data reads or writes."}, {"id": "Packages/Gmf.Net.Core.Common/ApplicationRunner.cs", "name": "ApplicationRunner", "kind": "module", "language": "csharp", "loc": 32, "file": "Packages/Gmf.Net.Core.Common/ApplicationRunner.cs"}, {"id": "Packages/Gmf.Net.Core.Common/Configuration/ConfigurationRetriever.cs", "name": "ConfigurationRetriever", "kind": "module", "language": "csharp", "loc": 17, "file": "Packages/Gmf.Net.Core.Common/Configuration/ConfigurationRetriever.cs"}, {"id": "Packages/Gmf.Net.Core.Common/Configuration/DeveloperContact.cs", "name": "DeveloperContact", "kind": "module", "language": "csharp", "loc": 5, "file": "Packages/Gmf.Net.Core.Common/Configuration/DeveloperContact.cs"}, {"id": "Packages/Gmf.Net.Core.Common/Configuration }

// ── Search ──────────────────────────────────────────────────────────────
const searchEl = document.getElementById("search"), resultsEl = document.getElementById("results");
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  resultsEl.innerHTML = "";
  if (q.length < 2) return;
  nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0, 12).forEach(n => {
    const d = document.createElement("div");
    d.innerHTML = `${esc(n.name)}<span class="kind">${esc(n.kind)}</span>`;
    d.onclick = () => { selected = n.id; resultsEl.innerHTML = ""; flyTo(n); renderSidebar(); requestDraw(); };
    resultsEl.appendChild(d);
  });
});

// ── Edge-kind toggles & legend ──────────────────────────────────────────
const togglesEl = document.getElementById("toggles");
for (const [kind, style] of Object.entries(EDGE_STYLE)) {
  if (!edges.some(e => e.kind === kind)) continue;
  const solid = style.color.replace(/[\d.]+\)$/, "0.9)");
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked><span class="swatch" style="background:${solid}"></span>${style.label}`;
  l.querySelector("input").onchange = ev => { kindOn[kind] = ev.target.checked; requestDraw(); };
  togglesEl.appendChild(l);
}
if (!togglesEl.children.length) togglesEl.style.display = "none";

// ── Flows ───────────────────────────────────────────────────────────────
const flowsPanel = document.getElementById("flows"), flowSel = document.getElementById("flowSel");
const flows = (DATA.flows || []).filter(Boolean).map(f => ({
  ...f,
  steps: (Array.isArray(f.steps) ? f.steps : []).map(s => ({
    label: String(s?.label ?? ""), nodes: (s?.nodes || []).map(String) })),
}));
if (flows.length) {
  flowsPanel.style.display = "";
  flows.forEach((f, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = f.persona ? `${f.name} (${f.persona})` : f.name;
    flowSel.appendChild(o);
  });
  flowSel.onchange = () => setFlow(flowSel.value);
}
function setFlow(v) {
  flowSel.value = v;
  activeFlow = v === "" ? null : flows[+v];
  if (activeFlow && !activeFlow._seq) {
    activeFlow._seq = activeFlow.steps.flatMap(st => st.nodes);
    activeFlow._set = new Set(activeFlow._seq);
  }
  selected = null;
  if (activeFlow) {
    const ids = activeFlow.steps.flatMap(s => s.nodes || []);
    const pts = ids.map(id => byId.get(id)).filter(Boolean);
    if (pts.length) {
      const minX = Math.min(...pts.map(n => n.x - n.r)), maxX = Math.max(...pts.map(n => n.x + n.r));
      const minY = Math.min(...pts.map(n => n.y - n.r)), maxY = Math.max(...pts.map(n => n.y + n.r));
      flyTo({ x: (minX + maxX) / 2, y: (minY + maxY) / 2, r: Math.max(maxX - minX, maxY - minY) / 2 || 100 });
    }
  }
  renderSidebar(); requestDraw();
  if (!activeFlow) sidebar.classList.remove("open");
}

// ── Observations ────────────────────────────────────────────────────────
if ((DATA.observations || []).length) {
  document.getElementById("obs").style.display = "";
  document.getElementById("obsList").innerHTML =
    DATA.observations.map(o => `<li style="margin:4px 0">${esc(o)}</li>`).join("");
}

// ── Boot ────────────────────────────────────────────────────────────────
document.getElementById("title").textContent = DATA.system || DATA.root.name || "System topology";
{
  const leaves = nodes.filter(n => !n.container);
  const stores = leaves.filter(n => n.kind === "datastore").length;
  document.getElementById("stats").textContent =
    `${leaves.length - stores} modules` + (stores ? ` · ${stores} data stores` : "") +
    ` · ${edges.length} edges` + (entrySet.size ? ` · ${entrySet.size} entry points` : "");
}
{
  const vw = innerWidth, vh = innerHeight;
  const k = Math.min(vw, vh) / (WORLD * 1.05);
  sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - WORLD / 2 * k, vh / 2 - WORLD / 2 * k).scale(k));
}
requestDraw();
</script>
</body>
</html>
