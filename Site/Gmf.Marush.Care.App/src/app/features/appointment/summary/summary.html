<marush-treatment-list [treatments]="checkedServices()" (remove)="onRemove($event)">
    <h4 slot="header" class="medium-title" i18n="@@routes.services">usluge</h4>
    <h4 class="medium-title" i18n="@@appointment.summary.total">Ukupno</h4>
    <strong class="price">{{totalCost() | money}}</strong>
    <p class="disclaimer column-12 offset-tablet-1 column-tablet-10" i18n="@@appointment.summary.disclaimer" role="alert">* Navedeni iznos nije račun i niste dužni da ga platite pre, već nakon tretmana. Razlog je takođe i u tome što Vaš zahtev može biti odbijen u slučaju da neko drugi u međuvremenu zakaže tretman preko naših partnerskih oglašivača.</p>
</marush-treatment-list>
