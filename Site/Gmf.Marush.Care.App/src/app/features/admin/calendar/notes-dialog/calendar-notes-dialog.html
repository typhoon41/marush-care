<marush-dialog [title]="titleLabel()">
    <marush-input slot="body" class="notes-input" name="content" placeholder="Unesite napomene..."
                  [form]="noteForm" [big]="true" [validation]="[]" />
    <div slot="actions" class="dialog-actions">
        @if (existingNoteId()) {
            <button type="button" class="line-button danger" [disabled]="isLoading()"
                    (click)="onDelete()">Obriši</button>
        }
        <button type="button" class="line-button primary"
                [disabled]="isLoading()" (click)="onSave()">Sačuvaj</button>
    </div>
</marush-dialog>
