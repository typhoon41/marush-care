<!-- eslint-disable @angular-eslint/template/interactive-supports-focus, @angular-eslint/template/click-events-have-key-events -->
<marush-dialog [title]="editingEntry() ? 'Termin' : 'Novi termin'">
    <form slot="body" class="entry-form" [formGroup]="form">
        <marush-input type="date" name="date" placeholder="Datum" [form]="form" [validation]="['required']" />
        <div class="form-row time-row">
            <div class="time-field">
                <span class="field-label">Početak</span>
                <marush-combobox name="startTime" [formGroup]="form"
                                 [items]="timeOptions"
                                 [(selectedItem)]="selectedStartTime" />
            </div>
            <div class="time-field">
                <span class="field-label">Kraj</span>
                <marush-combobox name="endTime" [formGroup]="form"
                                 [items]="timeOptions"
                                 [(selectedItem)]="selectedEndTime" />
            </div>
        </div>

        @if (showRescheduleWarning()) {
            <p class="reschedule-warning">
                Klijent će dobiti email obaveštenje o promeni termina.
            </p>
        }

        <div class="form-row">
            <marush-input name="query" placeholder="Pretraži klijenta" [form]="clientSearchForm" [validation]="[]" />
            @if (clientSearchResults().length > 0) {
                <ul class="search-results">
                    @for (client of clientSearchResults(); track client.id) {
                        <li class="search-result-item" (click)="selectClient(client)">{{ client.label }}</li>
                    }
                </ul>
            }
        </div>

        <marush-input name="money" type="number" placeholder="Iznos (RSD)"
                      [form]="form"
                      [validation]="[]" />
        <marush-input name="notes" placeholder="Napomene" [form]="form" [big]="true" [validation]="[]" />
    </form>

    <div slot="actions" class="dialog-actions">
        @if (editingEntry()) {
            <button type="button" class="cancel-action"
                    [disabled]="isLoading()" (click)="onDelete()">
                <span>Obriši termin</span>
            </button>
        }
        <button type="button" class="main-action"
                [disabled]="isLoading()" (click)="onSave()">
            <span>Sačuvaj</span>
        </button>
    </div>
</marush-dialog>
