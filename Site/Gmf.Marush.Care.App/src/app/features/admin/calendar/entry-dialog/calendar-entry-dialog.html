<marush-dialog [title]="editingEntry() ? 'Termin' : 'Novi termin'">
    <form slot="body" class="entry-form" [formGroup]="form">
        <marush-input type="date" name="date" placeholder="Datum" [form]="form" [validation]="['required']" />
        <div class="form-row time-row">
            <marush-combobox class="time-field" name="startTime" placeholder="Početak"
                             [formGroup]="form"
                             [items]="timeOptions"
                             [(selectedItem)]="selectedStartTime" />
            <marush-combobox class="time-field" name="endTime" placeholder="Kraj"
                             [formGroup]="form"
                             [items]="timeOptions"
                             [(selectedItem)]="selectedEndTime" />
        </div>

        @if (showRescheduleWarning()) {
            <p class="reschedule-warning">
                Klijent će dobiti email obaveštenje o promeni termina.
            </p>
        }

        <marush-autocomplete id="client-search" name="query" placeholder="Pretraži klijenta"
                             [form]="clientSearchForm" [search]="searchClients" [onSelected]="onClientSelected" />

        <marush-autocomplete id="treatment-search" name="query" placeholder="Pretraži tretmane"
                             [form]="treatmentSearchForm" [search]="searchTreatments" [onSelected]="onTreatmentSelected" />
        @for (name of selectedTreatments(); track name) {
            <div class="treatment-row">
                <button type="button" class="delete-action treatment-removal" (click)="removeTreatment(name)">
                    <img class="icon" alt="Ukloni tretman" src="/assets/images/actions/trash-can.svg">
                </button>
                <span class="treatment-label">{{treatmentLabel(name)}}</span>
            </div>
        }

        <marush-input name="money" type="number" placeholder="Iznos (RSD)"
                      [form]="form"
                      [validation]="[]" />
        <marush-input name="notes" placeholder="Napomene" [form]="form" [big]="true" [validation]="[]" />
    </form>

    <div slot="actions" class="dialog-actions">
        @if (editingEntry()) {
            <button type="button" class="cancel-action"
                    [disabled]="isLoading()" (click)="onDelete()">
                <span>Obriši termin</span>
            </button>
        }
        <button type="button" class="main-action"
                [disabled]="isLoading()" (click)="onSave()">
            <span>Sačuvaj</span>
        </button>
    </div>
</marush-dialog>
