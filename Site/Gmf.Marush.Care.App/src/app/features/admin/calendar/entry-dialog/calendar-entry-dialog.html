<!-- eslint-disable @angular-eslint/template/interactive-supports-focus, @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/cyclomatic-complexity -->
<marush-dialog [title]="editingEntry() ? 'Termin' : 'Novi termin'">
    <form slot="body" class="entry-form" [formGroup]="form">
        <div class="form-row">
            <label for="cal-date" class="field-label">Datum</label>
            <input id="cal-date" type="date" formControlName="date" class="date-input" (change)="onTimeChange()" />
        </div>
        <div class="form-row time-row">
            <div class="time-field">
                <label class="field-label">Početak</label>
                <marush-combobox [formGroup]="form" name="startTime"
                                 [items]="timeOptions"
                                 [(selectedItem)]="selectedStartTime"
                                 [onValueChanged]="onTimeChange" />
            </div>
            <div class="time-field">
                <label class="field-label">Kraj</label>
                <marush-combobox [formGroup]="form" name="endTime"
                                 [items]="timeOptions"
                                 [(selectedItem)]="selectedEndTime"
                                 [onValueChanged]="onTimeChange" />
            </div>
        </div>

        @if (showRescheduleWarning()) {
            <p class="reschedule-warning">
                Klijent će dobiti email obaveštenje o promeni termina.
            </p>
        }

        <div class="form-row">
            <label for="cal-search" class="field-label">Pretraži klijenta</label>
            <input id="cal-search" type="text" class="search-input" placeholder="Ime klijenta..."
                   (input)="onSearchInput($event)" />
            @if (clientSearchResults().length > 0) {
                <ul class="search-results">
                    @for (client of clientSearchResults(); track client.id) {
                        <li class="search-result-item" (click)="selectClient(client)">{{ client.label }}</li>
                    }
                </ul>
            }
        </div>

        <marush-input name="money" type="number" placeholder="Iznos (RSD)"
                      [form]="form"
                      [validation]="[]" />
        <marush-input name="notes" placeholder="Napomene" [form]="form" [big]="true" [validation]="[]" />
    </form>

    <div slot="actions" class="dialog-actions">
        @if (editingEntry()) {
            <button type="button" class="line-button danger"
                    [disabled]="isLoading()" (click)="onDelete()">
                Obriši termin
            </button>
        }
        <button type="button" class="line-button primary"
                [disabled]="isLoading()" (click)="onSave()">
            Sačuvaj
        </button>
    </div>
</marush-dialog>
