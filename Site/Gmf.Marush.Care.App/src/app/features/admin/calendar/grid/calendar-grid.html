<div #gridElement class="calendar-grid"
     (pointermove)="onPointerMove($event)"
     (pointerup)="onPointerUp()"
     (pointercancel)="drag.cancel()">

    <div class="calendar-header">
        <div class="grid-corner"></div>
        @for (day of days(); track day.isoDate) {
            <marush-calendar-day-header
                [day]="day"
                [dailyNote]="dailyNoteOn(day.isoDate)"
                [nonWorkingDay]="nonWorkingDayOn(day.isoDate)"
                (noteClick)="onDailyNoteClick($event)"
                (nonWorkingDayToggle)="onNonWorkingDayToggle(day.isoDate, $event)" />
        }
    </div>

    <div class="calendar-body">
        <div class="time-column">
            @for (slot of timeSlots; track slot.index) {
                <div class="time-label">{{ slot.label }}</div>
            }
        </div>

        @for (day of days(); track day.isoDate) {
            <marush-calendar-day-column
                [isoDate]="day.isoDate"
                [entries]="entriesOn(day.isoDate)"
                [appointments]="appointmentsOn(day.isoDate)"
                [nonWorking]="isNonWorkingDay(day.isoDate)"
                [isDragging]="drag.isActive()"
                [selectedSlots]="drag.selectedSlotsOn(day.isoDate)"
                [anchorSlot]="drag.anchorSlotOn(day.isoDate)"
                (slotPointerDown)="onSlotPointerDown(day.isoDate, $event)"
                (entryClick)="entryClick.emit($event)"
                (appointmentClick)="appointmentClick.emit($event)" />
        }
    </div>
</div>
