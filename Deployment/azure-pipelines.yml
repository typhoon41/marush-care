trigger:
  batch: true
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

pool:
  vmImage: windows-latest

variables:
  applicationVersion: 0.9
  isMain: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

name: $(applicationVersion).$(Rev:r)

stages:
- stage: 'Build'
  displayName: 'Build'
  jobs:
  - template: 'Templates/build.yaml'
    parameters:
      applicationVersion: $(applicationVersion)
      angularApplicationPath: 'Site/Gmf.Marush.Care.App'
      apiApplicationPath: 'Gmf.Marush.Care.Api'
      migrationsAssemblyPath: '../Gmf.Marush.Care.Infrastructure/Gmf.Marush.Care.Infrastructure.csproj'
- stage: 'DeployToTest'
  displayName: 'Deploy to Test'
  dependsOn: 'Build'
  condition: and(succeeded(), eq(variables['isMain'], 'True'))
  variables:
  - template: Variables/variables.test.yaml
  jobs:
  - template: 'Templates/environment-deploy.yaml'
    parameters:
      environment: 'Test'
      deploymentName: 'Api'
      destinationWebsiteName: MarushTest
      archiveFile: 'Gmf.Marush.Care.Api.zip'
      dbContextName: MarushCareContext
# Production approval is an "Approvals and checks" rule on the Production environment in Azure DevOps.
- stage: 'DeployToProduction'
  displayName: 'Deploy to Production'
  dependsOn: 'DeployToTest'
  condition: and(succeeded(), eq(variables['isMain'], 'True'))
  variables:
  - template: Variables/variables.production.yaml
  jobs:
  - template: 'Templates/environment-deploy.yaml'
    parameters:
      environment: 'Production'
      deploymentName: 'ProductionApi'
      destinationWebsiteName: Marush
      archiveFile: 'Gmf.Marush.Care.Api.zip'
      dbContextName: MarushCareContext
      shouldBackUpDatabase: true
