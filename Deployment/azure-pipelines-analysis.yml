trigger: none
name: 'Executing Marush Care Analysis'

schedules:
- cron: '0 12 * * 0'
  displayName: Weekly Sunday build
  branches:
    include:
    - main
  always: false

pool:
  vmImage: windows-latest

variables:
  solution: 'MarushCare.slnx'

steps:
  - checkout: self
    fetchDepth: 0 # SonarQube needs history for new-code detection and blame

  - task: UseDotNet@2
    displayName: 'Set .Net version'
    inputs:
      version: 10.0.x

  - task: DotNetCoreCLI@2
    displayName: 'Restore Packages'
    inputs:
      command: 'restore'
      projects: $(solution)

  - task: SonarQubePrepare@7
    displayName: 'Prepare SonarQube analysis'
    inputs:
      SonarQube: 'SonarQube'
      scannerMode: 'dotnet'
      projectKey: 'Marush'
      projectName: 'Marush'

  - task: DotNetCoreCLI@2
    displayName: 'Build'
    inputs:
      command: 'build'
      projects: $(solution)
      arguments: '--no-restore'

  # SonarQube Community Edition has no branch analysis; drop the branch name so results land on the main project.
  - powershell: |
      $params = "$env:SONARQUBE_SCANNER_PARAMS" -replace '"sonar.branch.name":"[\w,/,-]*"\,?'
      Write-Host "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$params"
    displayName: 'Fixing Sonar Branch'

  - task: SonarQubeAnalyze@7
    displayName: 'Run SonarQube analysis'

  - task: SonarQubePublish@7
    displayName: 'Publish SonarQube analysis'
    inputs:
      pollingTimeoutSec: '300'
