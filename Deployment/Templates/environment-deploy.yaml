parameters:
- name: deploymentName
- name: destinationWebsiteName
- name: environment
- name: dbContextName
- name: shouldBackUpDatabase
  type: boolean
  default: false
- name: projectName
  default: 'Marush'
- name: resourceName
  default: VMI1461179
- name: archiveFile
  default: 'Gmf.Marush.Care.App.zip'
- name: artifactName
  default: Marush

jobs:
  - deployment: ${{ parameters.deploymentName }}
    displayName: 'Executing ${{ parameters.deploymentName }} '
    variables:
    - name: environment
      value: ${{ parameters.environment }}
    environment:
      name: ${{ parameters.environment }}
      resourceName: ${{ parameters.resourceName }}
      resourceType: virtualMachine
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none # https://github.com/microsoft/azure-pipelines-tasks/issues/17207
          - task: DownloadPipelineArtifact@2
            displayName: Download artifact
            inputs:
              artifactName: '${{ parameters.artifactName }}-$(Build.BuildNumber)'
              targetPath: '$(Pipeline.Workspace)/${{ parameters.projectName }}-$(Build.BuildNumber)'

          - task: ExtractFiles@1
            displayName: 'Extract ${{ parameters.projectName }} Artifacts'
            inputs:
              archiveFilePatterns: '$(Pipeline.Workspace)/${{ parameters.projectName }}-$(Build.BuildNumber)/${{ parameters.archiveFile }}'
              destinationFolder: '$(Pipeline.Workspace)/${{ parameters.projectName }}/Temp/App'
            retryCountOnTaskFailure: 3

          - task: PowerShell@2
            displayName: 'Copy Robots.txt'
            inputs:
                targetType: inline
                script: Copy-Item -Path "$(Pipeline.Workspace)/${{ parameters.projectName }}/Temp/App/Properties/Robots.$(environment).txt" -Destination "$(Pipeline.Workspace)/${{ parameters.projectName }}/Temp/App/dist/browser/robots.txt"

          - task: PowerShell@2
            displayName: 'Copy Sitemaps'
            condition: eq(variables['environment'], 'Production')
            inputs:
                targetType: inline
                script: Copy-Item -Path "$(Pipeline.Workspace)/${{ parameters.projectName }}/Temp/App/Properties/sitemap.xml" -Destination "$(Pipeline.Workspace)/${{ parameters.projectName }}/Temp/App/dist/browser/sitemap.xml"

          - task: PowerShell@2
            displayName: 'Copy app_offline'
            inputs:
              targetType: inline
              script: Copy-Item -Path "$(Pipeline.Workspace)/${{ parameters.projectName }}/Temp/App/Properties/app_offline_template.htm" -Destination "$(Pipeline.Workspace)/${{ parameters.projectName }}/Temp/App/app_offline.htm" -Force

          - task: qetza.replacetokens.replacetokens-task.replacetokens@6
            displayName: 'Tokens replacement'
            inputs:
              root: '$(Pipeline.Workspace)/${{ parameters.projectName }}/Temp'
              sources: |
                **/dist/**/*.js
                **/dist/**/*.mjs
                **/web.config
                **/appsettings.json
              tokenPattern: custom
              tokenPrefix: '_-_-'
              tokenSuffix: '-_-_'
              telemetryOptout: true
              missingVarAction: keep
              missingVarLog: off

          - task: ArchiveFiles@2
            displayName: 'Pack ${{ parameters.projectName }} ${{ parameters.deploymentName }}'
            inputs:
              rootFolderOrFile: '$(Pipeline.Workspace)/${{ parameters.projectName }}/Temp/App'
              includeRootFolder: false
              archiveFile: '$(Build.ArtifactStagingDirectory)/${{ parameters.archiveFile }}'
            retryCountOnTaskFailure: 3

          - ${{ if parameters.shouldBackUpDatabase }}:
            - template: backup-database.yaml

          - script: |
              msdeploy.exe -source:contentPath="$(Pipeline.Workspace)\${{ parameters.projectName }}\Temp\App\Properties\app_offline_template.htm" -dest:contentPath='${{ parameters.destinationWebsiteName }}\app_offline.htm' -verb:sync -disablerule:BackupRule
            displayName: 'Put App Offline page'
            retryCountOnTaskFailure: 3

          - template: update-database.yaml
            parameters:
              dbContextName: ${{ parameters.dbContextName }}
              artifactName: ${{ parameters.artifactName }}

          - task: IISWebAppDeploymentOnMachineGroup@0
            displayName: 'Trigger built-in backup & Deploy ${{ parameters.projectName }} ${{ parameters.deploymentName }}'
            inputs:
              WebSiteName: ${{ parameters.destinationWebsiteName }}
              Package: '$(Build.ArtifactStagingDirectory)/${{ parameters.archiveFile }}'
              RemoveAdditionalFilesFlag: true
              AdditionalArguments: >
                -skip:skipaction=Delete,objectName=file,absolutePath='${{ parameters.destinationWebsiteName }}\app_offline.htm'
            retryCountOnTaskFailure: 3

          - script: |
              msdeploy.exe -dest:contentPath='${{ parameters.destinationWebsiteName }}/app_offline.htm' -verb:delete -disablerule:BackupRule
            workingDirectory: 'C:\Program Files\IIS\Microsoft Web Deploy V3\'
            failOnStderr: true
            displayName: 'Remove App Offline pages'
            # Runs even when database preparation or deployment fails, so a failed release never leaves the site offline.
            condition: always()
            retryCountOnTaskFailure: 3

          - task: PowerShell@2
            displayName: 'Clean up deployment files'
            condition: always()
            inputs:
              targetType: inline
              script: |
                $paths = @(
                  "$(Pipeline.Workspace)/${{ parameters.projectName }}",
                  "$(Pipeline.Workspace)/${{ parameters.projectName }}-$(Build.BuildNumber)",
                  "$(Pipeline.Workspace)/Migrations",
                  "$(Build.ArtifactStagingDirectory)/${{ parameters.archiveFile }}"
                )
                foreach ($path in $paths) {
                  if (Test-Path $path) {
                    Write-Host "Removing $path"
                    Remove-Item -Path $path -Recurse -Force
                  }
                }

  - job: smoke_test
    displayName: 'Smoke test ${{ parameters.environment }}'
    dependsOn: ${{ parameters.deploymentName }}
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: none
    - script: curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors --output /dev/null "$(applicationUrl)"
      displayName: 'Request $(applicationUrl)'

  - job: git_tag
    displayName: Create Git tag
    dependsOn: smoke_test
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      displayName: 'Checkout current repo'
      fetchDepth: 1
      persistCredentials: true
    - task: Bash@3
      displayName: Create Git tag
      inputs:
        targetType: 'inline'
        script: |
          git tag ${{ parameters.environment }}-$(Build.BuildNumber)
          git push origin ${{ parameters.environment }}-$(Build.BuildNumber)
