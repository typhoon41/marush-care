parameters:
- name: applicationVersion
- name: angularApplicationPath
- name: apiApplicationPath
- name: migrationsAssemblyPath
- name: dbContextName
  default: 'MarushCareContext'
- name: artifactName
  default: 'Marush'

jobs:
 - job: 'Build'
   variables:
      BuildParameters: -p:Version=${{ parameters.applicationVersion }} -p:FileVersion=$(Build.BuildNumber) -p:MarushRuntime=win-x64 --no-self-contained
      FullAppPath: Site/${{ parameters.apiApplicationPath }}
      ApplicationStagingPath: $(Build.ArtifactStagingDirectory)/App
      MigrationsStagingPath: $(Build.ArtifactStagingDirectory)/Migrations
      DotNetVersion: 10.0.x
      NodeVersion: 22.20.0
      NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
      # Only main produces deployable artifacts; pull request builds stop after the quality gates.
      ShouldPublish: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
   displayName: 'Build'
   steps:
      - checkout: self
        fetchDepth: 1

      - task: UseDotNet@2
        displayName: 'Set .Net version'
        inputs:
          version: $(DotNetVersion)

      - task: UseNode@1
        displayName: 'Set Node version'
        inputs:
          version: $(NodeVersion)

      - task: Cache@2
        displayName: 'Cache node modules'
        inputs:
          key: 'npm | "$(Agent.OS)" | ${{ parameters.angularApplicationPath }}/package-lock.json'
          path: '${{ parameters.angularApplicationPath }}/node_modules'
          cacheHitVar: 'NodeModulesCacheRestored'

      - task: Npm@1
        displayName: 'Install node modules'
        condition: and(succeeded(), ne(variables['NodeModulesCacheRestored'], 'true'))
        inputs:
          command: 'ci'
          workingDir: ${{ parameters.angularApplicationPath }}

      - task: Npm@1
        displayName: 'Execute Linting'
        inputs:
          command: 'custom'
          customCommand: 'run lint:ci'
          workingDir: ${{ parameters.angularApplicationPath }}

      - task: Npm@1
        displayName: 'Building Angular Application'
        inputs:
          command: 'custom'
          customCommand: 'run build --configuration=production'
          workingDir: ${{ parameters.angularApplicationPath }}

      - task: PowerShell@2
        displayName: 'Gate: translations are committed'
        inputs:
          targetType: inline
          workingDirectory: ${{ parameters.angularApplicationPath }}
          script: |
            npm run translate
            if ($LASTEXITCODE -ne 0) {
              throw 'npm run translate failed.'
            }
            git diff --exit-code --ignore-cr-at-eol -- src/locale
            if ($LASTEXITCODE -ne 0) {
              Write-Host "##vso[task.logissue type=error]Translations are out of date. Run 'npm run translate' in ${{ parameters.angularApplicationPath }} and commit src/locale."
              exit 1
            }

      - task: Cache@2
        displayName: 'Cache NuGet packages'
        inputs:
          key: 'nuget | "$(Agent.OS)" | **/packages.lock.json,!**/bin/**,!**/obj/**'
          restoreKeys: |
            nuget | "$(Agent.OS)"
          path: $(NUGET_PACKAGES)

      - task: DotNetCoreCLI@2
        displayName: 'Restoring NuGet Packages'
        inputs:
          command: 'restore'
          restoreArguments : '-r win-x64'

      - task: DotNetCoreCLI@2
        displayName: '.Net Core Build'
        inputs:
          command: 'custom'
          custom: 'build'
          arguments: --no-incremental --configuration Release --no-restore $(BuildParameters)

      - task: DotNetCoreCLI@2
        displayName: 'Packing artifacts'
        condition: and(succeeded(), eq(variables['ShouldPublish'], 'True'))
        inputs:
          command: 'publish'
          configuration: Release
          nobuild: True
          publishWebProjects: True
          arguments: -r win-x64 --output $(ApplicationStagingPath) -p:EnvironmentName=_-_-environment-_-_ $(BuildParameters)
          zipAfterPublish: True

      - task: PublishPipelineArtifact@1
        displayName: 'Publishing artifacts'
        condition: and(succeeded(), eq(variables['ShouldPublish'], 'True'))
        inputs:
          targetPath: $(ApplicationStagingPath)
          artifact: ${{ parameters.artifactName }}-$(Build.BuildNumber)

      - task: DotNetCoreCLI@2
        displayName: Create Entity Framework's Bundle for SQL
        condition: and(succeeded(), eq(variables['ShouldPublish'], 'True'))
        inputs:
          command: 'custom'
          workingDirectory: $(FullAppPath)
          custom: 'dnx'
          arguments: dotnet-ef@10.0.* -- migrations bundle --output $(MigrationsStagingPath)/${{ parameters.dbContextName }}-efbundle.exe --project ${{ parameters.migrationsAssemblyPath }} --startup-project ./${{ parameters.apiApplicationPath }}.csproj --context ${{ parameters.dbContextName }} --configuration Release --runtime win-x64 --force --verbose

      - task: CopyFiles@2
        displayName: 'Add appsettings.json to migration artifacts'
        condition: and(succeeded(), eq(variables['ShouldPublish'], 'True'))
        inputs:
          SourceFolder: $(FullAppPath)
          Contents: appsettings.json
          TargetFolder: $(MigrationsStagingPath)

      - task: PublishPipelineArtifact@1
        displayName: 'Publishing migration artifacts'
        condition: and(succeeded(), eq(variables['ShouldPublish'], 'True'))
        inputs:
          targetPath: $(MigrationsStagingPath)
          artifact: ${{ parameters.artifactName }}-migrations-$(Build.BuildNumber)
