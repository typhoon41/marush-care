parameters:
- name: dbContextName
- name: artifactName
  default: 'Marush'
- name: shouldBackUpDatabase
  type: boolean
  default: false
- name: backupsToKeep
  type: number
  default: 5

steps:
- task: DownloadPipelineArtifact@2
  displayName: Download migrations artifact
  inputs:
    artifactName: '${{ parameters.artifactName }}-migrations-$(Build.BuildNumber)'
    targetPath: '$(Pipeline.Workspace)/Migrations'

- ${{ if parameters.shouldBackUpDatabase }}:
  - task: PowerShell@2
    displayName: 'Back up database before migrations'
    env:
      DATABASE_CONNECTION: $(DatabaseConnectionString)
    inputs:
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'
        $builder = New-Object System.Data.SqlClient.SqlConnectionStringBuilder $env:DATABASE_CONNECTION
        $database = $builder.InitialCatalog
        if (-not $database) {
          throw 'The connection string has no Initial Catalog / Database.'
        }

        $backupFile = "$database-predeploy-$(Build.BuildNumber).bak"
        $escapedDatabase = $database.Replace(']', ']]')
        $escapedFile = $backupFile.Replace("'", "''")
        Write-Host "Backing up [$database] to the instance's default backup folder as $backupFile"

        $connection = New-Object System.Data.SqlClient.SqlConnection $env:DATABASE_CONNECTION
        $connection.Open()
        try {
          $command = $connection.CreateCommand()
          $command.CommandTimeout = 0
          $command.CommandText = "BACKUP DATABASE [$escapedDatabase] TO DISK = N'$escapedFile' WITH COPY_ONLY, INIT"
          [void]$command.ExecuteNonQuery()
        }
        finally {
          $connection.Close()
        }
        Write-Host 'Backup finished.'

  - task: PowerShell@2
    displayName: 'Rotate pre-deploy database backups'
    continueOnError: true
    env:
      DATABASE_CONNECTION: $(DatabaseConnectionString)
    inputs:
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'
        $builder = New-Object System.Data.SqlClient.SqlConnectionStringBuilder $env:DATABASE_CONNECTION
        $database = $builder.InitialCatalog

        $connection = New-Object System.Data.SqlClient.SqlConnection $env:DATABASE_CONNECTION
        $connection.Open()
        try {
          $command = $connection.CreateCommand()
          $command.CommandText = "SELECT CAST(SERVERPROPERTY('InstanceDefaultBackupPath') AS nvarchar(4000))"
          $backupFolder = [string]$command.ExecuteScalar()
        }
        finally {
          $connection.Close()
        }

        if (-not $backupFolder -or -not (Test-Path $backupFolder)) {
          Write-Host "Default backup folder '$backupFolder' is not reachable from the agent; skipping rotation."
          exit 0
        }

        $backups = Get-ChildItem -Path $backupFolder -Filter "$database-predeploy-*.bak" | Sort-Object LastWriteTime -Descending
        Write-Host "Found $($backups.Count) pre-deploy backup(s) in $backupFolder; keeping ${{ parameters.backupsToKeep }}."
        $backups | Select-Object -Skip ${{ parameters.backupsToKeep }} | ForEach-Object {
          Write-Host "Removing old backup: $($_.Name)"
          Remove-Item -Path $_.FullName -Force
        }

- task: CmdLine@2
  displayName: Execute migrations
  env:
    MIGRATION_CONNECTION: $(DatabaseConnectionString)
  inputs:
    script: '"$(Pipeline.Workspace)\Migrations\${{ parameters.dbContextName }}-efbundle.exe" --connection "%MIGRATION_CONNECTION%"'
